name: CI

# 这个仓库有 179 个单测，但它们此前只在 README 里写了"怎么跑"——
# 没有任何自动化在执行，所以回归只能靠手工。CI 只做三件事：
#   1. 跑单测（解析器/周次/计算器/提醒排期）
#   2. 跑 Android Lint（release 变体，不开 warningsAsErrors）
#   3. 编译 release 包（验证 R8 + 签名配置之外的构建链路完整）
#
# 未接 ktlint：现有代码有大量格式问题，一次性接入会产生一个淹没真实改动的
# 巨型 diff，建议单独一轮做。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 与 gradle/gradle-daemon-jvm.properties 的 toolchainVersion=21 保持一致
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Android Lint
        run: ./gradlew lintDebug --console=plain

      # 只做 assembleDebug：release 需要 keystore.properties（未入库），
      # 在 CI 上不可用。debug 变体足以验证 R8 之外的完整构建链路。
      - name: Assemble debug
        run: ./gradlew assembleDebug --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
